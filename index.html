<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FinalNight12</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0a0a0a;
  color:white;
  font-family:'Inter', sans-serif;
  height:100vh;
  overflow:hidden;
}

.container{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:60px 40px;
}

/* ===== HERO ===== */
.hero{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  margin-top:40px;
}

/* 🔥 العنوان متوازن */
h1{
  font-family:'Cinzel', serif;
  font-size:64px;
  font-weight:300;

  letter-spacing:8px;
  text-transform:uppercase;

  color:#f5f5f5;

  margin-bottom:20px;
  text-align:center;

  text-shadow:0 0 30px rgba(255,255,255,0.05);

  font-variant-ligatures:none;
  -webkit-font-smoothing: antialiased;
}

/* ===== DESCRIPTION ===== */
.desc{
  max-width:720px;
  font-size:16.5px;
  line-height:1.9;
  font-weight:200;

  color:#c2c2c2; /* 👈 واضح بدون غباش */
  opacity:1;

  letter-spacing:0.2px;
}

/* glitch */
.dim{
  opacity:0.2;
}

/* ===== FOOTER ===== */
.footer{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  padding-bottom:10px;
}

.social-title{
  font-size:12px;
  letter-spacing:5px;
  opacity:0.6;
}

.socials{
  display:flex;
  gap:22px;
}

.socials a{
  color:white;
  font-size:22px;
  opacity:0.6;
  transition:0.3s ease;
}
</style>
</head>

<body>

<div class="container">

  <div class="hero">
    <h1 id="title">FinalNight12</h1>

    <p class="desc">
      <span id="w1">FinalNight12</span> is a psychological horror experience built from 
      <span id="w2">horror cases</span> ...
      each case is based on <span id="w3">real events</span> ...
      these are not just stories ...
      they are <span id="w4">records</span> of what actually happened to 
      <span id="w5">real people</span>.
    </p>
  </div>

  <div class="footer">
    <div class="social-title">@FINALNIGHT12 ON SOCIALS</div>

    <div class="socials">
      <a href="#"><i class="fa-brands fa-tiktok"></i></a>
      <a href="#"><i class="fa-brands fa-instagram"></i></a>
      <a href="#"><i class="fa-brands fa-youtube"></i></a>
      <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
      <a href="#"><i class="fa-brands fa-discord"></i></a>
      <a href="#"><i class="fa-brands fa-twitch"></i></a>
    </div>
  </div>

</div>

<script>

const title = document.getElementById("title");

const words = [
  document.getElementById("w1"),
  document.getElementById("w2"),
  document.getElementById("w3"),
  document.getElementById("w4"),
  document.getElementById("w5")
];

const symbols = ["!", "@", "*", "#", "$", "-", "+"];

/* 🎭 glitch عام */
function glitch(el, original){

  let count = 0;

  let interval = setInterval(()=>{

    el.textContent = original.split("").map(ch =>
      Math.random() < 0.6
        ? symbols[Math.floor(Math.random()*symbols.length)]
        : ch
    ).join("");

    count++;

    if(count > 10){
      clearInterval(interval);
      el.textContent = original;
    }

  }, 70);
}

/* 🔥 عنوان كل 15 ثانية */
function titleGlitch(){
  glitch(title, "FinalNight12");
}

/* 🚀 كل الكلمات مع بعض */
function glitchAllWords(){
  words.forEach(el => {
    glitch(el, el.textContent);
  });
}

/* تشغيل */
window.addEventListener("load", () => {

  setTimeout(() => {
    titleGlitch();
  }, 600);

  setInterval(() => {
    titleGlitch();
  }, 15000);

  setTimeout(() => {
    glitchAllWords();
  }, 1200);

});

</script>

</body>
</html>
