<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FinalNight12</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<!-- أيقونات السوشال -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  margin: 0;
  font-family: 'Cinzel', serif;
  color: white;
  overflow: hidden;
}

/* 🎥 الخلفية */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  background: url("https://images.unsplash.com/photo-1501785888041-af3ef285b470") center/cover no-repeat;
  filter: brightness(0.4);
  z-index: -1;
}

/* 🌫️ طبقة ضباب */
.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, transparent, black 80%);
  z-index: -1;
}

/* 🧠 النص الرئيسي */
.container {
  text-align: center;
  position: absolute;
  top: 35%;
  left: 50%;
  transform: translate(-50%, -50%);
}

h1 {
  font-size: 70px;
  letter-spacing: 4px;
  text-shadow: 0 0 10px black;
}

/* ✍️ الوصف */
p {
  max-width: 700px;
  margin: auto;
  color: #ddd;
  line-height: 1.6;
}

/* 🎮 السوشال */
.socials {
  position: absolute;
  bottom: 40px;
  width: 100%;
  text-align: center;
}

.socials i {
  font-size: 22px;
  margin: 0 10px;
  cursor: pointer;
  transition: 0.3s;
}

.socials i:hover {
  transform: scale(1.2);
  color: red;
}

.username {
  margin-top: 10px;
  color: #aaa;
  font-size: 14px;
}

/* ✨ تأثير دخول */
.container {
  animation: fadeIn 2s ease;
}

@keyframes fadeIn {
  from {opacity: 0; transform: translate(-50%, -40%);}
  to {opacity: 1; transform: translate(-50%, -50%);}
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<!-- 🧠 المحتوى -->
<div class="container">
  <h1>FinalNight12</h1>

  <p>
    FinalNight12 is a psychological horror experience built from archived horror files.
    Each file documents a different case… based on real events.
    These are not just stories. They are records of what actually happened.
  </p>
</div>

<!-- 🔗 سوشال ميديا -->
<div class="socials">
  <i class="fab fa-instagram"></i>
  <i class="fab fa-twitch"></i>
  <i class="fab fa-discord"></i>
  <i class="fab fa-x-twitter"></i>
  <i class="fab fa-tiktok"></i>
  <i class="fab fa-youtube"></i>

  <div class="username">@FinalNight12 on Socials</div>
</div>

</body>
</html>
