<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FinalNight12</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0a0a0a;
  color:white;
  font-family:'Inter', sans-serif;
  height:100vh;
  overflow:hidden;
}

/* ===== MODERN LAYOUT ===== */
.container{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:60px 40px;
}

/* ===== HERO ===== */
.hero{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  margin-top:40px;
}

h1{
  font-family:'Cinzel', serif;
  font-size:64px;
  letter-spacing:14px;
  font-weight:500;
  text-transform:uppercase;
  color:#f5f5f5;
  margin-bottom:20px;
  text-shadow:0 0 60px rgba(255,255,255,0.06);
}

h1.dim{ opacity:0.25; }

/* ===== DESCRIPTION ===== */
.desc{
  max-width:720px;
  font-size:16.5px;
  line-height:1.9;
  font-weight:200;
  color:#cfcfcf;
  opacity:0.9;
}

/* ===== FOOTER SOCIALS ===== */
.footer{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  padding-bottom:10px;
}

.social-title{
  font-size:12px;
  letter-spacing:5px;
  opacity:0.6;
}

.socials{
  display:flex;
  gap:22px;
}

.socials a{
  color:white;
  font-size:22px;
  opacity:0.6;
  transition:0.3s ease;
}

.socials a:hover{
  opacity:1;
  transform:translateY(-3px) scale(1.1);
}
</style>
</head>

<body>

<div class="container">

  <!-- HERO -->
  <div class="hero">
    <h1 id="title">FinalNight12</h1>

    <p class="desc">
      FinalNight12 is a psychological horror experience built from horror cases ...
      each case is based on real events ...
      these are not just stories ...
      they are records of what actually happened to real people.
    </p>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="social-title">@FINALNIGHT12 ON SOCIALS</div>

    <div class="socials">
      <a href="#"><i class="fa-brands fa-tiktok"></i></a>
      <a href="#"><i class="fa-brands fa-instagram"></i></a>
      <a href="#"><i class="fa-brands fa-youtube"></i></a>
      <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
      <a href="#"><i class="fa-brands fa-discord"></i></a>
      <a href="#"><i class="fa-brands fa-twitch"></i></a>
    </div>
  </div>

</div>

<script>
const title = document.getElementById("title");

function flicker(){
  const r = Math.random();

  if(r < 0.04){
    title.classList.add("dim");
    setTimeout(()=>title.classList.remove("dim"),120);
  }

  if(r > 0.992){
    title.classList.add("dim");
    setTimeout(()=>title.classList.remove("dim"),200);
  }
}

setInterval(flicker, 500);
</script>

</body>
</html>
