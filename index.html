<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinalNight12</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Creepster&family=VT323&display=swap');

    body {
      margin: 0;
      height: 100vh;
      background: #000000;
      color: #ffffff;
      font-family: 'VT323', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    .content {
      z-index: 2;
    }

    h1 {
      font-family: 'Creepster', cursive;
      font-size: 6.5rem;
      margin: 0 0 20px 0;
      color: #f0f0f0;
      text-shadow: 
        0 0 10px #ffffff,
        0 0 20px #ffffff,
        0 0 40px #ff0000,
        0 0 60px #ff0000;
      animation: flicker 1.2s infinite alternate;
    }

    p {
      font-size: 1.55rem;
      max-width: 720px;
      margin: 0 auto 60px;
      color: #cccccc;
      line-height: 1.5;
    }

    .social-text {
      font-size: 1.4rem;
      margin-bottom: 20px;
      color: #888888;
    }

    .socials a {
      font-size: 3.2rem;
      margin: 0 20px;
      color: #bbbbbb;
      transition: all 0.3s;
      text-decoration: none;
    }

    .socials a:hover {
      color: #ff3333;
      transform: scale(1.3);
      text-shadow: 0 0 15px #ff0000;
    }

    /* تأثير الوميض */
    @keyframes flicker {
      0%   { opacity: 0.95; }
      50%  { opacity: 0.65; }
      100% { opacity: 0.98; }
    }

    /* تأثير مطر خفيف اختياري */
    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        transparent 0px,
        transparent 2px,
        rgba(255,255,255,0.03) 3px
      );
      pointer-events: none;
      animation: rain 0.4s linear infinite;
    }
  </style>
</head>
<body>

  <div class="content">
    <h1>FinalNight12</h1>
    <p>FinalNight12 is a psychological horror experience built from archived horror files.<br>
    Each file documents a different case... based on real events.<br>
    These are not just stories. They are records of what actually happened.</p>

    <div class="social-text">@FinalNight12 on Socials</div>
    
    <div class="socials">
      <a href="رابط_الديسكورد" target="_blank" title="Discord">🟣</a>
      <a href="رابط_الانستغرام" target="_blank" title="Instagram">📷</a>
      <a href="رابط_اكس" target="_blank" title="X">𝕏</a>
      <a href="رابط_التيكتوك" target="_blank" title="TikTok">🎵</a>
      <a href="رابط_اليوتيوب" target="_blank" title="YouTube">▶️</a>
    </div>
  </div>

  <div class="overlay"></div>
</body>
</html>
